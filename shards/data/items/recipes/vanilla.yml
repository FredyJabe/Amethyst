# Vanilla item tags have been expanded to the protocol-777 item alternatives,
# because Amethyst's current recipe parser accepts item IDs, not #tag references.
# All vanilla recipe types are represented; specialized component-dependent recipes
# are registered even when their full in-game execution is not yet implemented.
# Smoker/blast cooking ticks are halved for current Amethyst workstation speed.
# The existing bundled starter recipes are overridden where recipe IDs coincide.
# Data uses one root node per vanilla recipe ID (brewing recipe IDs include '/').
