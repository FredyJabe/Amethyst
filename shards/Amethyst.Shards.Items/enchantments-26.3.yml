# Minecraft Java 26.3 - all 43 vanilla enchantments.
# Keys are vanilla registry identifiers. Numeric bonuses are Stats, not skill mechanics.
# Skills execute actions via Core's shared SkillEngine; Stats apply on matching events.
# Copy individual keys into shards/data/items/enchantments/*.yml to override them.
# Runtime hooks supply event context; effects without a producer/sink remain declarative.

aqua_affinity:
  Id: minecraft:aqua_affinity
  MaxLevel: 1
  Weight: 2
  AnvilCost: 4
  SupportedItems: [helmet]
  Stats:
    mining_speed:
      Trigger: onMine
      Operation: multiply
      Base: 1
      PerLevel: 1
      Conditions: ["flag{name=underwater}"]

