# Minecraft Java 26.3 - all 43 vanilla enchantments.
# Keys are vanilla registry identifiers. Skills execute via Core's shared SkillEngine.
# Copy individual keys into shards/data/items/enchantments/*.yml to override them.
# Runtime hooks supply event context; effects without a producer/sink remain declarative.

aqua_affinity:
  Id: minecraft:aqua_affinity
  MaxLevel: 1
  Weight: 2
  AnvilCost: 4
  SupportedItems: [helmet]
  Skills:
    - "modify{stat=mining_speed;operation=multiply;base=1;perLevel=1} @self ~onMine ?flag{name=underwater}"

