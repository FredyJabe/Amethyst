# Java 26.3 entity rewards, exclusively triggered by Items-owned ~onDeath skills.
# No entity has automatic loot-table drops or implicit experience.
# All entries explicitly select the pinned data-pack table or Items mechanics.
# Override in shards/data/items/loot/*.yml; Skills: [] means no drops or XP.
# If a vanilla table is absent or unsupported, the explicit skill logs the
# unsupported roll and grants nothing. No hidden fallback is performed.

