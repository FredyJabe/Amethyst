# Java 26.3 loot skills maintained by the Items Shard.
# One root per entity kind, one ordered Skills list.
# Override in shards/data/items/loot/*.yml (Skills: [] disables defaults).
# dropItem intents are committed by Gameplay AFTER all skills run.
# This is the first entity loot table, not the entire vanilla loot dataset.
minecraft:sheep:
  Skills:
    - "dropItem{item=minecraft:mutton;min=1;max=2;bonus=looting} @self ~onDeath"
    - "dropItem{item=minecraft:white_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_white}"
    - "dropItem{item=minecraft:orange_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_orange}"
    - "dropItem{item=minecraft:magenta_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_magenta}"
    - "dropItem{item=minecraft:light_blue_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_light_blue}"
    - "dropItem{item=minecraft:yellow_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_yellow}"
    - "dropItem{item=minecraft:lime_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_lime}"
    - "dropItem{item=minecraft:pink_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_pink}"
    - "dropItem{item=minecraft:gray_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_gray}"
    - "dropItem{item=minecraft:light_gray_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_light_gray}"
    - "dropItem{item=minecraft:cyan_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_cyan}"
    - "dropItem{item=minecraft:purple_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_purple}"
    - "dropItem{item=minecraft:blue_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_blue}"
    - "dropItem{item=minecraft:brown_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_brown}"
    - "dropItem{item=minecraft:green_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_green}"
    - "dropItem{item=minecraft:red_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_red}"
    - "dropItem{item=minecraft:black_wool;amount=1} @self ~onDeath ?flag{name=not_sheared} ?flag{name=color_black}"

minecraft:fishing:
  Skills:
    # Starter fishing distribution matches the prior server behavior.
    # Exact vanilla treasure/junk tables and biome predicates are pending.
    - "dropItem{item=minecraft:cod;amount=1} @self ~onFishing ?range{name=loot_roll;min=0;max=54}"
    - "dropItem{item=minecraft:salmon;amount=1} @self ~onFishing ?range{name=loot_roll;min=55;max=79}"
    - "dropItem{item=minecraft:pufferfish;amount=1} @self ~onFishing ?range{name=loot_roll;min=80;max=88}"
    - "dropItem{item=minecraft:tropical_fish;amount=1} @self ~onFishing ?range{name=loot_roll;min=89;max=94}"
    - "dropItem{item=minecraft:bowl;amount=1} @self ~onFishing ?range{name=loot_roll;min=95;max=97}"
    - "dropItem{item=minecraft:nautilus_shell;amount=1} @self ~onFishing ?range{name=loot_roll;min=98;max=99}"
