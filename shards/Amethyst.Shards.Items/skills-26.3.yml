# Java 26.3 starter item/entity interactions.
# All ~onDeath rewards, including XP, are defined exclusively in loot-26.3.yml.
# Administrator overrides go into shards/data/items/loot/*.yml.
# Do not re-add default entity drops here; item/entity interaction skills remain.
sheep:
  Skills:
    - 'dropItem{item=minecraft:white_wool;amount=1-3} ~onShear ?flag{name=color_white}'
