# Java 26.3 starter death skills (not the complete vanilla loot system).
# Entity root -> Mythic-style skills; all item drops belong to Items Shard.
# dropItem{item=minecraft:beef;amount=1-3;chance=1} ~onDeath
# Use shards/data/items/skills/*.yml for administrator overrides.
cow:
  Skills:
    - 'dropItem{item=minecraft:beef;amount=1-3} ~onDeath'
    - 'dropItem{item=minecraft:leather;amount=0-2} ~onDeath'
pig:
  Skills:
    - 'dropItem{item=minecraft:porkchop;amount=1-3} ~onDeath'
chicken:
  Skills:
    - 'dropItem{item=minecraft:chicken;amount=1-1} ~onDeath'
    - 'dropItem{item=minecraft:feather;amount=0-2} ~onDeath'
sheep:
  Skills:
    - 'dropItem{item=minecraft:white_wool;amount=1-3} ~onShear ?flag{name=color_white}'
    - 'dropItem{item=minecraft:orange_wool;amount=1-3} ~onShear ?flag{name=color_orange}'
    - 'dropItem{item=minecraft:magenta_wool;amount=1-3} ~onShear ?flag{name=color_magenta}'
    - 'dropItem{item=minecraft:light_blue_wool;amount=1-3} ~onShear ?flag{name=color_light_blue}'
    - 'dropItem{item=minecraft:yellow_wool;amount=1-3} ~onShear ?flag{name=color_yellow}'
    - 'dropItem{item=minecraft:lime_wool;amount=1-3} ~onShear ?flag{name=color_lime}'
    - 'dropItem{item=minecraft:pink_wool;amount=1-3} ~onShear ?flag{name=color_pink}'
    - 'dropItem{item=minecraft:gray_wool;amount=1-3} ~onShear ?flag{name=color_gray}'
    - 'dropItem{item=minecraft:light_gray_wool;amount=1-3} ~onShear ?flag{name=color_light_gray}'
    - 'dropItem{item=minecraft:cyan_wool;amount=1-3} ~onShear ?flag{name=color_cyan}'
    - 'dropItem{item=minecraft:purple_wool;amount=1-3} ~onShear ?flag{name=color_purple}'
    - 'dropItem{item=minecraft:blue_wool;amount=1-3} ~onShear ?flag{name=color_blue}'
    - 'dropItem{item=minecraft:brown_wool;amount=1-3} ~onShear ?flag{name=color_brown}'
    - 'dropItem{item=minecraft:green_wool;amount=1-3} ~onShear ?flag{name=color_green}'
    - 'dropItem{item=minecraft:red_wool;amount=1-3} ~onShear ?flag{name=color_red}'
    - 'dropItem{item=minecraft:black_wool;amount=1-3} ~onShear ?flag{name=color_black}'
zombie:
  Skills:
    - 'dropItem{item=minecraft:rotten_flesh;amount=0-2} ~onDeath'
skeleton:
  Skills:
    - 'dropItem{item=minecraft:bone;amount=0-2} ~onDeath'
    - 'dropItem{item=minecraft:arrow;amount=0-2} ~onDeath'
spider:
  Skills:
    - 'dropItem{item=minecraft:string;amount=0-2} ~onDeath'
    - 'dropItem{item=minecraft:spider_eye;amount=1-1;chance=0.3333} ~onDeath'
creeper:
