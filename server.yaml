# Amethyst | .NET 10 | Minecraft Java 26.3 (protocol 777)
bindAddress: "127.0.0.1"
port: 25565
motd: "Amethyst | Procedural World"
maxPlayers: 20
# Always keep true on servers available outside your own machine.
onlineMode: true
# Chat is relayed as server system messages; signed chat verification is not yet implemented.
chatEnabled: true
chatMaxLength: 256
chatCooldownMilliseconds: 350
# Paths are relative to the folder holding this server.yaml file.
operatorsFile: "ops.yaml"
# Interactive terminal (auto = use when attached to a real TTY).
# Use plain under systemd, Docker without -it, log files, or redirected stdin.
consoleMode: auto
consoleHistorySize: 100
viewDistance: 10
# A 24000-tick day. Default 20 minutes = vanilla Minecraft speed.
# 0=sunrise, 6000=noon, 12000=sunset, 18000=midnight.
startTimeTicks: 1000
dayLengthMinutes: 20
daylightCycle: true

# Signed 64-bit decimal world seed. Identical settings + seed = identical terrain.
seed: 87420913
# Version 7 keeps the v6 world shape/decoration and creates sparser,
# locally bounded cave aquifers (most caves are dry).
# Version 5 preserves the original Phase 5 feature layout.
# 4 = aquifers/material rules only, 3 = dry density caves,
# 2 = continental heightmap, 1 = original heightmap.
generatorVersion: 7
# Higher values make climate regions smaller (also reshapes terrain in versions 2 and 3).
climateScale: 1.0
# Climate-shaped height-field settings (our own seed-to-world mapping).
baseHeight: 70
seaLevel: 63
heightVariation: 36
# Higher values produce smaller relief, ridge and river features.
terrainScale: 1.0
# 'auto' now uses five independently seeded climate fields: temperature,
# humidity, continentalness, erosion and weirdness.
# Set to a vanilla ID such as minecraft:plains to use one biome everywhere.
biome: auto

# Phase 4+ (generatorVersion >= 4):
# Sparse 3D aquifers fill selected underground spaces; below the
# lava threshold, deeper cave cavities may hold lava instead.
aquifersEnabled: true
aquiferLavaLevel: -48
aquiferWaterTableOffset: 18
# Number of solid layers receiving biome-specific surface materials.
surfaceDepth: 4

# Phase 5+ (generatorVersion >= 5):
featureDensity: 1.0
oreFrequency: 1.0
# Small boulders and rare ruined stone arches; NOT full villages.
structureFrequency: 1.0
# Save generated chunk snapshots immediately to avoid regeneration on restart.
saveGeneratedChunks: true
# Separate worlds/settings require separate directories (world.yaml pins seed/settings).
# New generation settings must use a separate saved world directory.
worldPath: "worlds/phase7"

# Chunk performance (changes do not affect terrain generated by the seed):
chunkWorkers: 4
maxQueuedChunks: 1024
maxCachedColumns: 1024
maxCachedLights: 512
maxCachedLightSources: 256
maxCachedPackets: 512
cachedTerrainSamples: 32768
cachedFeatureHeights: 8192
asyncWorldSaves: true
saveQueueCapacity: 128
# 0: show performance only when typing `perf` into the console.
performanceReportSeconds: 0

# Shards are compiled separately and loaded from installed DLL directories.
# Each installed shard.yaml controls whether the Shard starts enabled.
shardsDirectory: "shards/installed"
shardsDataDirectory: "shards/data"
