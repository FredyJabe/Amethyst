<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171329">
  <meta name="description" content="Amethyst is an open-source Minecraft Java Edition server written in C# and .NET.">
  <title>Amethyst · Minecraft Server for .NET</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f5f0ff;
      background: radial-gradient(ellipse at 50% 10%, #483174 0, #241936 42%, #131020 100%); }
    main { width: min(100% - 2.5rem, 720px); padding: 5rem 0; text-align: center; }
    .gem { font-size: 4.5rem; line-height: 1; filter: drop-shadow(0 7px 30px #a77bff70); }
    h1 { font-size: clamp(3rem, 9vw, 5.5rem); letter-spacing: -.055em; margin: .8rem 0 1rem; }
    p { color: #cdc3df; font-size: clamp(1rem, 3vw, 1.2rem); line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; margin-top: 2rem; }
    a { display: inline-block; color: #fff; text-decoration: none; font-weight: 600; padding: .8rem 1.25rem;
      border: 1px solid #74628f; border-radius: .7rem; }
    a.primary { background: #8b5bdd; border-color: #8b5bdd; }
    a:hover, a:focus-visible { background: #644399; outline: 2px solid transparent; }
    .note { margin-top: 3.5rem; font-size: .9rem; color: #a99dbf; }
  </style>
</head>
<body>
  <main>
    <div class="gem" aria-hidden="true">💎</div>
    <h1>Amethyst</h1>
    <p>An open-source Minecraft Java Edition server built from scratch in C# and .NET.</p>
    <div class="actions">
      <a class="primary" href="https://github.com/FredyJabe/Amethyst">View on GitHub</a>
    </div>
    <p class="note">Project website and documentation are coming soon.</p>
  </main>
</body>
</html>
